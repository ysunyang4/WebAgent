<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WebAgent 1.3.1 控制中心</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo-box">
      <div class="logo-icon">🚀</div>
      <div class="logo-info">
        <h3>WebAgent</h3>
        <span class="version">v1.3.1 (Web AI MCP Bridge)</span>
      </div>
    </div>
    <div class="status-badge" id="bridgeStatusBadge">检测中...</div>
  </div>

  <div class="card">
    <div class="card-title">🌐 本地服务状态</div>
    <div class="stat-row">
      <span>WebAgent Bridge (18080)</span>
      <span class="badge" id="mcpBridgeStatus">--</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">⚙️ 智能体运行策略</div>
    <div class="setting-item">
      <div class="setting-label">
        <strong>自动执行工具调用</strong>
        <p>检测到 AI 输出工具代码块时自动调度</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoExecuteToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-item">
      <div class="setting-label">
        <strong>自动遭遇限流冷却重试</strong>
        <p>网页模型遇到速率限制时自动冷却并重发</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="autoRetryToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-item">
      <div class="setting-label">
        <strong>安全润色保护模式</strong>
        <p>仅追加批注建议，严禁直接覆盖原文</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="safeModeToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="card-title">📁 工作区与路径配置</div>
    <div class="input-group">
      <label>默认工作目录 (支持全盘任意路径):</label>
      <input type="text" id="workspacePathInput" placeholder="例如: C:/workspace (留空需每次自行指定)">
    </div>
      </div>

  <div class="actions">
    <button id="injectPromptBtn" class="btn btn-primary">📋 复制增强协作协议</button>
    <button id="saveConfigBtn" class="btn btn-secondary">💾 保存配置</button>
  </div>

  <div class="footer">
    <span>💡 提示：在 DeepSeek / ChatGPT / Duck.ai 等页面顶部已自动浮动药丸面板</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
